<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · ExpenseX</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090909" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Self-contained on purpose: this page has to render with no network,
         which means no webfont, no stylesheet and no script from the build. */
      :root {
        color-scheme: light;
        --canvas: #f5f5f5;
        --surface: #ffffff;
        --forest: #171717;
        --on-forest: #fafafa;
        --ink: #171717;
        --ink-3: #666666;
        --line: rgba(22, 28, 21, 0.18);
        --accent: #858585;
        --on-accent: #171717;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #090909;
          --surface: #141414;
          --forest: #292929;
          --ink: #f5f5f5;
          --ink-3: #a3a3a3;
          --line: rgba(226, 231, 214, 0.16);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 30rem;
        background: var(--surface);
        border-radius: 22px;
        padding: 2rem 1.5rem 1.75rem;
      }
      @media (min-width: 30rem) {
        main {
          padding: 2.75rem 2.5rem 2.25rem;
        }
      }
      .wordmark {
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .wordmark span {
        opacity: 0.45;
      }
      .label {
        margin: 2rem 0 0;
        font-family: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(1.6rem, 7vw, 2.25rem);
        line-height: 1.08;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      p {
        margin: 1rem 0 0;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--ink-3);
      }
      .rule {
        margin: 1.75rem 0 0;
        height: 1px;
        background: var(--line);
        border: 0;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 3rem;
        border: 0;
        border-radius: 8px;
        background: var(--forest);
        color: var(--on-forest);
        font-family: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', monospace;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.92;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hatch {
        margin-top: 1.75rem;
        height: 2.5rem;
        background-image: repeating-linear-gradient(
          90deg,
          var(--line) 0,
          var(--line) 1px,
          transparent 1px,
          transparent 6px
        );
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">expense<span>x</span></p>

      <p class="label">No connection</p>
      <h1>You are offline.</h1>
      <p>
        ExpenseX keeps your money on the server, not on this device, so there is nothing to show
        until the connection is back. Nothing you saved has been lost.
      </p>

      <hr class="rule" />
      <button type="button" onclick="location.reload()">Try again</button>

    </main>
  </body>
</html>
