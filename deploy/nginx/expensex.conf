# ExpenseX — Nginx reverse proxy in front of `next start` on 127.0.0.1:3000.
#
# Install on a Hostinger VPS as:
#   /etc/nginx/sites-available/expensex.conf   (then symlink into sites-enabled)
#
# Replace expensex.example.com with your own domain before enabling.
# Run certbot AFTER this file is in place; it rewrites the TLS block itself.

server {
    listen 80;
    listen [::]:80;
    server_name expensex.example.com www.expensex.example.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name expensex.example.com www.expensex.example.com;

    # certbot --nginx fills these in. Placeholders until then.
    ssl_certificate     /etc/letsencrypt/live/expensex.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expensex.example.com/privkey.pem;

    # The app writes its own security headers (see next.config.ts); adding a
    # second set here would produce conflicting CSPs.
    server_tokens off;

    # Server actions post form data; 1mb matches next.config.ts's bodySizeLimit.
    client_max_body_size 2m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---- Immutable build output ------------------------------------------
    # Hashed filenames: let the browser keep them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Realtime stream --------------------------------------------------
    # /api/realtime is Server-Sent Events. Without `proxy_buffering off` Nginx
    # holds each event in its buffer and the feed appears to be broken; without
    # a long read timeout it is cut off after 60 seconds.
    location /api/realtime {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # ---- Everything else --------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Next.js reads this to know it is behind TLS. Without it the session
        # cookie (Secure in production) is set but never sent back.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
